{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<section class="vacio">
  <h1>{{ titulo }}</h1>
  <p>¿Seguro que quieres eliminar «{{ object }}»? Esta acción no se puede deshacer.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-peligro">Sí, eliminar</button>
    <a class="btn btn-secundario" href="{{ url_lista }}">Cancelar</a>
  </form>
</section>
{% endblock %}
